name: Bug report
description: Something in Folio does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Do not open an issue; follow SECURITY.md instead. Never paste real financial data or passwords."
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did, what you expected and what you saw. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Folio version, placeholder: "1.1.0" }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How do you run Folio?
      options: [Docker (Linux), Docker Desktop (macOS), Docker Desktop (Windows), Native Node.js (Linux), Native Node.js (macOS), Termux (Android)]
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser or device, placeholder: "Safari on iPhone 14, home-screen app" }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: "docker compose logs, or folio.log for native installs. Remove anything private.", render: text }
