# Folio on this VPS: listens on 127.0.0.1:${PORT} (host network, loopback only); nginx terminates HTTPS.
services:
  folio:
    build: .
    image: folio:local
    container_name: folio
    network_mode: host
    env_file: .env
    environment:
      FOLIO_DB_PATH: /data/folio.sqlite
    volumes:
      - ../folio-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
