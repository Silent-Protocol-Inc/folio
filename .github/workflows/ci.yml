name: CI

# Every pull request and every push to main runs the same gates. Branch protection requires them before merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Build
        run: npm run build
      - name: End-to-end tests (real server, throwaway SQLite)
        run: npm test
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck install.sh and deploy scripts
        run: shellcheck -S warning install.sh deploy/backup.sh
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  native-install:
    name: Native install (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run install.sh in native mode from this checkout
        env:
          CI: "1"
          FOLIO_MODE: native
          FOLIO_SOURCE: ${{ github.workspace }}
          FOLIO_DIR: ${{ runner.temp }}/folio
          FOLIO_PORT: "4321"
          FOLIO_ORIGIN: http://localhost:4321
          FOLIO_EMAIL: ci@example.com
        run: bash install.sh
      - name: Folio answers and the control script works
        run: |
          curl -fsS http://127.0.0.1:4321/api/session
          "$RUNNER_TEMP/folio/folio" status
          "$RUNNER_TEMP/folio/folio" stop

  docker:
    name: Docker image and installer
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t folio:ci .
      - name: Run install.sh in Docker mode with the image just built
        env:
          CI: "1"
          FOLIO_MODE: docker
          FOLIO_IMAGE: folio:ci
          FOLIO_DIR: ${{ runner.temp }}/folio
          FOLIO_PORT: "4322"
          FOLIO_ORIGIN: http://localhost:4322
          FOLIO_EMAIL: ci@example.com
        run: bash install.sh
      - name: Folio answers on 127.0.0.1 only
        run: |
          curl -fsS http://127.0.0.1:4322/api/session
          docker compose -f "$RUNNER_TEMP/folio/docker-compose.yml" ps
          ! curl -fsS --max-time 3 "http://$(hostname -I | awk '{print $1}'):4322/api/session"
